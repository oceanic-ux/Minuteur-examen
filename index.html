<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minuteurs multi-examens — Haut-Lac</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f5f4f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
.card{background:#fff;border-radius:16px;border:1px solid #e0ddd6;padding:2rem;width:100%;max-width:1100px;position:relative}
body.is-fullscreen{background:#fff;padding:0;overflow:hidden;height:100vh;width:100vw;align-items:center;justify-content:center}
body.is-fullscreen .card{border:none;border-radius:0;max-width:none;width:100vw;height:100vh;overflow-y:auto;padding:1.2rem 2vw;display:flex;flex-direction:column;justify-content:center}

/* Top bar */
.top-bar{position:absolute;top:16px;right:16px;display:none;gap:8px;align-items:center;z-index:10}
.top-bar.visible{display:flex}
.top-btn{background:none;border:1px solid #ccc;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;color:#666;display:flex;align-items:center;gap:6px;font-family:inherit;transition:background .12s}
.top-btn:hover{background:#f5f4f0}
.top-btn.active{background:#eaf1fb;border-color:#3a7bd5;color:#1a4a8a}
.quit-btn{position:fixed;bottom:20px;right:20px;z-index:50;background:none;border:1px solid #ccc;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;color:#999;display:none;align-items:center;gap:6px;font-family:inherit;transition:background .12s,color .12s,border-color .12s}
.quit-btn:hover{background:#fdf0f0;border-color:#e0a0a0;color:#a03030}
.quit-btn.visible{display:flex}
.icon{width:15px;height:15px;vertical-align:-2px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;display:inline-block;flex-shrink:0}

/* Live clock */
#live-clock{font-size:40px;font-weight:600;font-family:'Arial','Helvetica Neue',sans-serif;font-variant-numeric:normal;color:#1a1a18;letter-spacing:-1.5px;line-height:1;margin-bottom:1rem}
body.is-fullscreen #live-clock{font-size:clamp(32px,7vh,80px)}

/* ── SETUP ── */
h1{font-size:20px;font-weight:500;color:#1a1a18;margin-bottom:1.5rem}
.section-title{font-size:13px;color:#666;margin-bottom:8px;font-weight:500}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:13px;color:#666;margin-bottom:5px}
input[type=text],input[type=number]{padding:8px 12px;border:1px solid #d0cdc6;border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a18;background:#fff;outline:none;width:100%}
input[type=text]:focus,input[type=number]:focus{border-color:#3a7bd5}
.reading-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid #e0ddd6;border-radius:10px;background:#fafaf8;cursor:pointer;user-select:none;transition:border-color .15s,background .15s;margin-bottom:1.1rem}
.reading-row.on{border-color:#3a7bd5;background:#eaf1fb}
.reading-left{display:flex;flex-direction:column;gap:2px}
.reading-name{font-size:14px;font-weight:500;color:#1a1a18}
.reading-row.on .reading-name{color:#1a4a8a}
.reading-sub{font-size:12px;color:#999}
.reading-row.on .reading-sub{color:#3a7bd5}
.reading-controls{display:flex;align-items:center;gap:8px}
.reading-input{width:58px;padding:5px 8px;border:1px solid #d0cdc6;border-radius:6px;font-size:14px;font-family:inherit;text-align:center;color:#1a1a18;background:#fff;outline:none}
.reading-input:disabled{opacity:.35;cursor:not-allowed}
.reading-input-label{font-size:12px;color:#888}
.sw{width:36px;height:20px;border-radius:99px;background:#ccc;position:relative;flex-shrink:0;transition:background .2s;cursor:pointer}
.sw.on{background:#3a7bd5}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on::after{transform:translateX(16px)}
.option-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid #e0ddd6;border-radius:10px;background:#fafaf8;cursor:pointer;user-select:none;margin-bottom:1.1rem;transition:border-color .15s,background .15s}
.option-row:hover{background:#f0ede8}
.option-row-text{flex:1}
.option-row-label{font-size:14px;font-weight:500;color:#1a1a18}
.option-row-sub{font-size:12px;color:#999;margin-top:1px}
.exam-list{display:flex;flex-direction:column;gap:12px;margin-bottom:1.1rem}
.exam-card{border:1px solid #e0ddd6;border-radius:12px;padding:14px 16px;background:#fafaf8}
.exam-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.exam-card-num{font-size:12px;font-weight:600;color:#3a7bd5;letter-spacing:.04em;}
.exam-card-remove{background:none;border:none;cursor:pointer;color:#bbb;font-size:18px;line-height:1;padding:2px 6px;border-radius:4px;font-family:inherit;transition:color .12s}
.exam-card-remove:hover{color:#a03030}
.time-row{display:flex;gap:8px;margin-bottom:10px}
.time-row .field{flex:1;margin-bottom:0}
.time-row .field label{font-size:12px}
.extra-toggles{display:flex;gap:8px;flex-wrap:wrap}
.extra-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid #e0ddd6;border-radius:8px;background:#fff;cursor:pointer;user-select:none;font-size:13px;color:#666;transition:border-color .15s,background .15s,color .15s}
.extra-toggle.on{border-color:#3a7bd5;background:#eaf1fb;color:#1a4a8a}
.extra-toggle .sw-sm{width:28px;height:16px;border-radius:99px;background:#ccc;position:relative;flex-shrink:0;transition:background .2s}
.extra-toggle.on .sw-sm{background:#3a7bd5}
.extra-toggle .sw-sm::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.extra-toggle.on .sw-sm::after{transform:translateX(12px)}
.add-exam-btn{width:100%;padding:10px;border:1px dashed #c0bdb6;border-radius:10px;background:none;cursor:pointer;font-size:14px;color:#888;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .12s,color .12s,background .12s;margin-bottom:1.1rem}
.add-exam-btn:hover{border-color:#3a7bd5;color:#3a7bd5;background:#f0f6ff}
.alert-row{display:flex;align-items:center;gap:12px;margin-bottom:1.1rem}
.alert-row label{font-size:13px;color:#666;white-space:nowrap}
.start-btn{width:100%;padding:13px;border:none;border-radius:8px;background:#3a7bd5;color:#fff;font-size:16px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:.5rem;display:flex;align-items:center;justify-content:center;gap:8px}
.start-btn:hover{background:#2d62b8}
.start-btn:disabled{background:#b0b0b0;cursor:not-allowed}

/* ── TIMER VIEW ── */
#timer-view{display:none}
#timer-view.active{display:block;width:100%}
#exam-section{display:none;width:100%}
.exams-columns{display:flex;gap:0;align-items:stretch}
.exam-col{flex:1;padding:0 16px;border-right:1px solid #f0ede8;min-width:0;display:flex;flex-direction:column}
.exam-col:first-child{padding-left:0}
.exam-col:last-child{border-right:none;padding-right:0}
.exam-col-title{font-size:20px;font-weight:600;color:#1a1a18;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f0ede8}

/* Waiting state */
.col-waiting{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:20px 0;gap:12px}
.col-waiting-label{font-size:12px;color:#bbb;letter-spacing:.05em}
.col-start-btn{padding:10px 18px;border:none;border-radius:8px;background:#3a7bd5;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:background .12s}
.col-start-btn:hover{background:#2d62b8}

/* Reading phase in column */
.col-reading-phase{background:#fffbeb;border:1px solid #f5d87a;border-radius:10px;padding:10px 14px;margin-bottom:10px}
.col-reading-label{font-size:10px;font-weight:600;color:#a07000;letter-spacing:.05em;margin-bottom:4px}
.col-reading-disp{font-size:32px;font-weight:600;font-family:'Arial',sans-serif;font-variant-numeric:normal;color:#6b4b00;letter-spacing:-1px;line-height:1}
.col-reading-disp.warning{color:#7b1a1a}

.timer-block{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid #f8f6f2}
.timer-block:last-of-type{border-bottom:none}
.timer-block.done-blk{opacity:.4}
.t-label{font-size:10px;color:#aaa;margin-bottom:1px;letter-spacing:.04em;font-weight:500}
.t-display{font-size:40px;font-weight:600;font-family:'Arial','Helvetica Neue',sans-serif;font-variant-numeric:normal;color:#1a1a18;letter-spacing:-1.5px;line-height:1}
.t-display.near30{color:#1a5abf}
.t-display.warning{color:#c0392b}
.t-display.done-txt{color:#ccc}
.t-display.greyed{color:#aaa}
.t-total{font-size:11px;color:#ccc;margin-top:2px}
.done-badge{display:inline-block;font-size:9px;font-weight:600;background:#e8e6e0;color:#999;border-radius:99px;padding:2px 7px;margin-left:5px;vertical-align:2px}
.milestones{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.ms-item{font-size:10px;color:#bbb;display:flex;align-items:center;gap:4px;line-height:1.4;white-space:nowrap}
.ms-item strong{font-weight:600}
.ms-item.ms-30{color:#5580c0}
.ms-item.ms-5{color:#b07a50}
.ms-item.ms-end{color:#999}
.ms-item.ms-passed{opacity:.45;text-decoration:line-through}
.ms-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0}
.col-controls{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
/* Speaking indicator */
.speaking-dot{
  position:absolute;top:-4px;right:-4px;
  width:20px;height:20px;border-radius:50%;
  background:#3a7bd5;color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;pointer-events:none;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
  animation:speakPulse 1s ease-in-out infinite;
}
.speaking-dot.active{opacity:1;}
@keyframes speakPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
.ib-type-select{width:100%;padding:6px 8px;border:1px solid #d0cdc6;border-radius:7px;font-size:13px;font-family:inherit;color:#1a1a18;background:#fff;outline:none;margin-top:6px}
.ib-type-select:focus{border-color:#3a7bd5}
.ib-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:#eaf1fb;color:#1a4a8a;margin-left:6px;vertical-align:2px}

.divider{height:1px;background:#e8e6e0;margin:1rem 0}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-btn{padding:7px 13px;border:1px solid #d0cdc6;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:#1a1a18;display:flex;align-items:center;gap:5px;font-family:inherit;transition:background .12s}
.ctrl-btn:hover{background:#f5f4f0}
.ctrl-btn.primary{background:#3a7bd5;color:#fff;border-color:#3a7bd5}
.ctrl-btn.primary:hover{background:#2d62b8}
.ctrl-btn.green{background:#27ae60;color:#fff;border-color:#27ae60}
.ctrl-btn.green:hover{background:#219a52}

/* ── SIDE PANEL ── */
.side-panel{position:fixed;top:0;right:-420px;width:400px;max-width:95vw;height:100vh;background:#fff;border-left:1px solid #e0ddd6;box-shadow:-4px 0 24px rgba(0,0,0,.08);z-index:200;display:flex;flex-direction:column;transition:right .28s cubic-bezier(.4,0,.2,1);overflow:hidden}
.side-panel.open{right:0}
.side-panel-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid #f0ede8;flex-shrink:0}
.side-panel-title{font-size:16px;font-weight:600;color:#1a1a18}
.side-panel-close{background:none;border:none;cursor:pointer;color:#aaa;font-size:22px;line-height:1;padding:2px 6px;border-radius:4px;transition:color .12s}
.side-panel-close:hover{color:#333}
.panel-tabs{display:flex;border-bottom:1px solid #f0ede8;flex-shrink:0}
.panel-tab{flex:1;padding:10px 6px;font-size:13px;font-weight:500;color:#999;background:none;border:none;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.panel-tab.active{color:#3a7bd5;border-bottom-color:#3a7bd5}
.panel-tab:hover:not(.active){color:#666}
.panel-body{flex:1;overflow-y:auto;padding:16px 20px}

/* Adjust tab */
.adj-exam-section{margin-bottom:1.2rem}
.adj-exam-title{font-size:13px;font-weight:600;color:#3a7bd5;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #f0ede8}
.adj-timer-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid #f8f6f2;gap:8px}
.adj-timer-row:last-of-type{border-bottom:none}
.adj-timer-label{font-size:13px;font-weight:500;color:#1a1a18;flex:1;min-width:0}
.adj-timer-live{font-size:13px;color:#999;font-family:'Arial',sans-serif;font-variant-numeric:normal;min-width:50px;text-align:right;flex-shrink:0}
.adj-btns{display:flex;gap:3px;flex-shrink:0}
.adj-btn{height:26px;padding:0 7px;border:1px solid #d0cdc6;border-radius:5px;background:#fff;cursor:pointer;font-size:11px;font-weight:600;color:#444;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .1s;white-space:nowrap}
.adj-btn:hover{background:#f0ede8}

/* Add exam tab */
.panel-section-title{font-size:12px;font-weight:600;color:#888;margin-bottom:10px;letter-spacing:.04em;}
.panel-field{margin-bottom:9px}
.panel-field label{display:block;font-size:12px;color:#888;margin-bottom:3px}
.panel-field input{padding:7px 10px;font-size:13px}
.panel-time-row{display:flex;gap:7px;margin-bottom:9px}
.panel-time-row .panel-field{flex:1;margin-bottom:0}
.panel-reading-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid #e0ddd6;border-radius:9px;background:#fafaf8;cursor:pointer;user-select:none;margin-bottom:10px;transition:border-color .15s,background .15s}
.panel-reading-row.on{border-color:#3a7bd5;background:#eaf1fb}
.panel-reading-name{font-size:13px;font-weight:500;color:#1a1a18}
.panel-reading-row.on .panel-reading-name{color:#1a4a8a}
.panel-reading-ctrls{display:flex;align-items:center;gap:6px}
.panel-reading-inp{width:48px;padding:4px 6px;border:1px solid #d0cdc6;border-radius:5px;font-size:13px;font-family:inherit;text-align:center;color:#1a1a18;background:#fff;outline:none}
.panel-reading-inp:disabled{opacity:.35;cursor:not-allowed}
.panel-reading-label{font-size:11px;color:#888}
.panel-divider{height:1px;background:#f0ede8;margin:12px 0}
.panel-confirm-btn{width:100%;padding:10px;border:none;border-radius:8px;background:#3a7bd5;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .12s}
.panel-confirm-btn:hover{background:#2d62b8}
.panel-confirm-btn:disabled{background:#b0b0b0;cursor:not-allowed}
</style>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minuteurs">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
<div class="card">
  <div class="top-bar" id="top-bar">
    <button class="top-btn" id="settings-top-btn" onclick="togglePanel()">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span id="ui-settings-btn">Réglages</span>
    </button>
    <button class="top-btn" onclick="toggleFullscreen()">
      <svg class="icon" id="fullscreen-icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      <span id="fullscreen-label">Plein écran</span>
    </button>
  </div>

  <button class="quit-btn" id="quit-btn" onclick="confirmQuit()">
    <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    <span id="ui-quit">Quitter</span>
  </button>

  <div id="live-clock" style="display:none"></div>

  <!-- SETUP -->
  <div id="setup-panel">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
      <h1 style="margin-bottom:0" id="ui-title">Minuteurs multi-examens</h1>
      <div style="display:flex;gap:5px;flex-shrink:0">
        <button id="uilang-fr" onclick="setUILang('fr')"
          style="padding:4px 11px;border-radius:7px;border:1px solid #3a7bd5;background:#3a7bd5;color:#fff;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600">FR</button>
        <button id="uilang-en" onclick="setUILang('en')"
          style="padding:4px 11px;border-radius:7px;border:1px solid #d0cdc6;background:#fff;color:#888;cursor:pointer;font-size:12px;font-family:inherit">EN</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid #e8e0c8;border-radius:10px;background:#fffbe6;margin-bottom:1rem">
      <span class="reading-name" id="ui-reading-name" style="color:#7a6000;font-size:13px;font-weight:600;flex-shrink:0">Temps de lecture</span>
      <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
        <input type="number" class="reading-input" id="inp-reading" min="1" max="60" value="5" oninput="updateReadingSub()">
        <span class="reading-input-label" style="font-size:13px;color:#888">min</span>
      </div>
    </div>
    <div style="font-size:11px;color:#aaa;margin-top:-10px;margin-bottom:1rem;padding-left:2px" id="reading-sub">Activez par épreuve ci-dessous</div>
    <div class="section-title" id="ui-exams-section">Examens</div>
    <div class="exam-list" id="exam-list"></div>
    <button class="add-exam-btn" onclick="addExam()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span id="ui-add-exam">Ajouter un examen</span>
    </button>
    <div class="section-title" id="ui-alerts-section" style="margin-bottom:8px">Alertes sonores</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:1.1rem">
      <div style="display:flex;align-items:center;gap:10px">
        <label style="font-size:13px;color:#666;white-space:nowrap;flex:1" id="ui-alert30-label">Première alerte avant la fin</label>
        <input type="number" id="inp-alert30" min="1" max="180" value="30" style="width:64px;flex-shrink:0" oninput="ALERT_30=alert30Enabled?(parseInt(this.value)||30)*60:0;savePrefs()">
        <span style="font-size:13px;color:#888;flex-shrink:0">min</span>
        <div class="sw on" id="sw-alert30" onclick="toggleAlert30()" style="flex-shrink:0"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <label style="font-size:13px;color:#666;white-space:nowrap;flex:1" id="ui-alert5-label">Deuxième alerte avant la fin</label>
        <input type="number" id="inp-alert" min="0" max="120" value="5" style="width:64px;flex-shrink:0" oninput="alertSecs=alert5Enabled?(parseInt(this.value)||5)*60:0;savePrefs()">
        <span style="font-size:13px;color:#888;flex-shrink:0">min</span>
        <div class="sw on" id="sw-alert5" onclick="toggleAlert5()" style="flex-shrink:0"></div>
      </div>

// ── CLOCK ──
function nowClock(){const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());}
function fmtClockAt(s){const t=new Date(Date.now()+s*1000);return pad(t.getHours())+':'+pad(t.getMinutes());}
function tickClock(){const el=document.getElementById('live-clock');if(el&&el.style.display!=='none')el.textContent=nowClock();}

// ── HELPERS ──
function pad(n){return String(n).padStart(2,'0');}
function fmtTime(s){if(s<0)s=0;const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h>0?h+':'+pad(m)+':'+pad(sc):pad(m)+':'+pad(sc);}
function fmtHuman(s){if(s<=0)return'0 min';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;if(h>0&&m>0)return h+'h'+pad(m);if(h>0)return h+'h';if(m>0&&sc>0)return m+' min '+sc+' s';if(m>0)return m+' min';return sc+' s';}
// Spoken form of a timer label like "+25%" or "+1/3" for TTS
function fmtSpokenLabel(label, fr){
  if(!label)return label;
  const s=label.replace(/^\+/,'').trim();
  // Fraction like "1/3", "1/4", "2/3"
  const fracMatch=s.match(/^(\d+)\/(\d+)$/);
  if(fracMatch){
    const n=parseInt(fracMatch[1]), d=parseInt(fracMatch[2]);
    if(fr){
      const dFr={2:'demi',3:'tiers',4:'quart',5:'cinquième',6:'sixième',8:'huitième',10:'dixième'};
      const denom=dFr[d]||(d+'ième');
      const plural=n>1&&d>2?'s':'';
      return n===1?denom:n+' '+denom+plural;
    } else {
      const dEn={2:'half',3:'third',4:'quarter',5:'fifth',6:'sixth',8:'eighth',10:'tenth'};
      const denom=dEn[d]||(d+'th');
      const plural=n>1&&d>2?'s':'';
      return n===1?denom:n+' '+denom+plural;
    }
  }
  // Percentage like "25%" or "33.3%"
  const pctMatch=s.match(/^([\d.]+)%$/);
  if(pctMatch){
    const v=parseFloat(pctMatch[1]);
    const vStr=Number.isInteger(v)?String(v):(fr?String(v).replace('.',','):String(v));
    return fr?vStr+' pour cent':vStr+' percent';
  }
  return label; // fallback
}
function fmtSpoken(s,fr=true){
  if(s<=0)return fr?'zéro minute':'zero minutes';
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  if(fr){
    if(h>0&&m>0)return h+(h>1?' heures':' heure')+' '+m+(m>1?' minutes':' minute');
    if(h>0)return h+(h>1?' heures':' heure');
    return m+(m>1?' minutes':' minute');
  } else {
    if(h>0&&m>0)return h+(h>1?' hours':' hour')+' '+m+(m>1?' minutes':' minute');
    if(h>0)return h+(h>1?' hours':' hour');
    return m+(m>1?' minutes':' minute');
  }
}
function getExamBase(eid){return(parseInt(document.getElementById('inp-h-'+eid).value)||0)*3600+(parseInt(document.getElementById('inp-m-'+eid).value)||0)*60+(parseInt(document.getElementById('inp-s-'+eid).value)||0);}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── MILESTONES ──
function milestonesHTML(t){
  if(t.done)return'';
  const l=t.left;let h='';
  const fr=announceLang==='fr';
  // First alert (30 min by default, configurable)
  if(alert30Enabled&&ALERT_30>0){
    const at30=l-ALERT_30;
    const lbl='−'+Math.round(ALERT_30/60)+' min';
    if(at30>0)h+=`<div class="ms-item ms-30"><span class="ms-dot"></span>${lbl} → <strong>${fmtClockAt(at30)}</strong></div>`;
    else h+=`<div class="ms-item ms-30 ms-passed"><span class="ms-dot"></span>${lbl} ${fr?'passé':'past'}</div>`;
  }
  // Second alert (5 min by default, configurable)
  if(alert5Enabled&&alertSecs>0){
    const at5=l-alertSecs;
    const lbl='−'+Math.round(alertSecs/60)+' min';
    if(at5>0)h+=`<div class="ms-item ms-5"><span class="ms-dot"></span>${lbl} → <strong>${fmtClockAt(at5)}</strong></div>`;
    else if(l>0)h+=`<div class="ms-item ms-5 ms-passed"><span class="ms-dot"></span>${lbl} ${fr?'passé':'past'}</div>`;
  }
  if(l>0)h+=`<div class="ms-item ms-end"><span class="ms-dot"></span>${fr?'Fin':'End'} → <strong>${fmtClockAt(l)}</strong></div>`;
  return`<div class="milestones" id="ms-${t.id}">${h}</div>`;
}
function refreshMilestones(t){
  const el=document.getElementById('ms-'+t.id);if(!el)return;
  const tmp=document.createElement('div');tmp.innerHTML=milestonesHTML(t);
  if(tmp.firstElementChild)el.innerHTML=tmp.firstElementChild.innerHTML;
}

function buildVoiceSettingsPanel(){
  const panel=document.getElementById('voice-settings-panel');
  if(!panel)return;
  const lang=announceLang;
  const fr=lang==='fr';
  const labels=TMPL_LABELS[lang];
  const tokens=TMPL_TOKENS[lang];

  let html='';
  TMPL_EVENTS.forEach(function(event){
    const segs=getTemplate(event);
    let segsHtml=renderTemplateEditor(event,segs,tokens,fr);
    let tokenBtns='';
    tokens.forEach(function(tk){
      tokenBtns+='<button onclick="addTokenToTemplate(\''+event+'\',\''+tk.id+'\')" '
        +'style="padding:3px 8px;border:1px solid #3a7bd5;border-radius:6px;background:#fff;color:#3a7bd5;cursor:pointer;font-size:11px;font-family:inherit">'
        +'+ '+escHtml(tk.label)+'</button>';
    });
    tokenBtns+='<button onclick="addTextToTemplate(\''+event+'\')" '
      +'style="padding:3px 8px;border:1px solid #888;border-radius:6px;background:#fff;color:#555;cursor:pointer;font-size:11px;font-family:inherit">'
      +'+ Texte</button>';
    tokenBtns+='<button onclick="resetTemplate(\''+event+'\')" '
      +'style="padding:3px 8px;border:1px solid #c00;border-radius:6px;background:#fff;color:#c00;cursor:pointer;font-size:11px;font-family:inherit;margin-left:auto">'
      +'\u21ba D\u00e9faut</button>';
    html+='<div style="margin-bottom:12px;border:1px solid #c0d4ec;border-radius:8px;padding:8px 10px;background:#f0f6ff">'
      +'<div style="font-size:12px;font-weight:600;color:#1a4a8a;margin-bottom:6px">'+(labels[event]||event)+'</div>'
      +'<div id="tmpl-segs-'+event+'" style="display:flex;flex-direction:column;gap:4px">'+segsHtml+'</div>'
      +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">'+tokenBtns+'</div>'
      +'</div>';
  });
  panel.innerHTML=html;
}

function renderTemplateEditor(event,segs,tokens,fr){
  let html='';
  segs.forEach(function(seg,i){
    if(seg.k){
      const tk=tokens.find(function(t){return t.id===seg.k;});
      html+='<div style="display:flex;align-items:center;gap:4px">'
        +'<span style="padding:3px 8px;background:#3a7bd5;color:#fff;border-radius:6px;font-size:12px;font-family:inherit">'+(tk?escHtml(tk.label):seg.k)+'</span>'
        +'<button onclick="removeSegment(\''+event+'\','+i+')" style="border:none;background:none;cursor:pointer;color:#c00;font-size:14px;line-height:1">\u00d7</button>'
        +'</div>';
    } else {
      html+='<div style="display:flex;align-items:center;gap:4px">'
        +'<input type="text" value="'+escHtml(seg.t||'')+'" '
        +'oninput="updateSegText(\''+event+'\','+i+',this.value)" '
        +'style="flex:1;padding:4px 6px;border:1px solid #a0b8d8;border-radius:6px;font-size:12px;font-family:inherit;color:#1a1a18">'
        +'<button onclick="removeSegment(\''+event+'\','+i+')" style="border:none;background:none;cursor:pointer;color:#c00;font-size:14px;line-height:1;flex-shrink:0">\u00d7</button>'
        +'</div>';
    }
  });
  return html;
}

function _ensureCustomTemplate(event){
  const lang=announceLang;
  if(!_customTemplates[lang])_customTemplates[lang]={};
  if(!_customTemplates[lang][event]){
    // Deep copy default
    _customTemplates[lang][event]=JSON.parse(JSON.stringify(TMPL_DEFAULTS[lang][event]||[]));
  }
  return _customTemplates[lang][event];
}

function addTokenToTemplate(event,tokenId){
  const segs=_ensureCustomTemplate(event);
  segs.push({k:tokenId});
  saveTemplates();
  buildVoiceSettingsPanel();
}

function addTextToTemplate(event){
  const segs=_ensureCustomTemplate(event);
  segs.push({t:''});
  saveTemplates();
  buildVoiceSettingsPanel();
}

function removeSegment(event,idx){
  const segs=_ensureCustomTemplate(event);
  segs.splice(idx,1);
  saveTemplates();
  buildVoiceSettingsPanel();
}

function updateSegText(event,idx,val){
  const segs=_ensureCustomTemplate(event);
  if(segs[idx])segs[idx].t=val;
  saveTemplates();
}

function resetTemplate(event){
  const lang=announceLang;
  if(!_customTemplates[lang])_customTemplates[lang]={};
  _customTemplates[lang][event]=JSON.parse(JSON.stringify(TMPL_DEFAULTS[lang][event]||[]));
  saveTemplates();
  buildVoiceSettingsPanel();
}



// IB exam type labels for display
const IB_TYPE_LABELS={
  ns:{fr:'Non-structuré',en:'Non-structured'},
  ss:{fr:'Structuré/semi-structuré',en:'Structured/semi-structured'},
  mcq:{fr:'QCM',en:'Multiple choice'},
  acq:{fr:'Acquisition de langues',en:'Language acquisition'}
};

// ── IB ANNOUNCEMENTS TABLE ──
// null = no announcement for this event/type
// Functions receive (exam, lang, now) where now=Date object at trigger time
function ibText(type, event, lang, exam, now, timer){
  const fr=lang==='fr';
  // Use specific timer duration if provided, otherwise principal
  const timerForDur=timer||exam.timers.find(ti=>ti.label==='Principal');
  const dur=fmtSpoken(timerForDur?.total||0,fr);
  const isExtra=timer&&timer.label!=='Principal';
  const heure=now?(now.getHours()+(fr?' heures ':' hours ')+now.getMinutes().toString().padStart(2,'0')):'';
  const heureEn=now?(now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes()):'';

  if(event==='readingStart'){
    if(type==='mcq')return null;
    return fr
      ?"Vous pouvez à présent ouvrir votre épreuve d'examen. Votre temps de lecture commence maintenant."
      :"You may now open your examination paper. Your reading time starts now.";
  }

  if(event==='readingEnd'){
    if(type==='mcq')return null;
    return fr
      ?`Le temps de lecture est terminé. Vous avez ${dur} pour cette épreuve d'examen. Vous pouvez commencer à écrire. Il est ${heure}.`
      :`Your reading time is over. You have ${dur} for this examination paper. You may start to write. The time now is ${heureEn}.`;
  }

  if(event==='examStart'){
    if(type!=='mcq')return null;
    return fr
      ?`Vous pouvez commencer à écrire. Il est ${heure}.`
      :`You may now start the examination. The time now is ${heureEn}.`;
  }

  if(event==='alert30'){
    if(type==='acq')return null;
    return fr?"Il vous reste 30 minutes.":"The time remaining is 30 minutes.";
  }

  if(event==='alert5'){
    if(type==='acq')return null;
    if(type==='ns')
      return fr
        ?"Il vous reste cinq minutes. Assurez-vous de rayer d'un trait toute partie de votre travail que vous ne voulez pas voir prise en compte lors de la notation. Si cela s'applique à la totalité d'une question, n'oubliez pas de noircir la case contenant le numéro de la question."
        :"The time remaining is five minutes. Please ensure you draw a line through any work that you do not wish to be marked; if this applies to a whole question, remember to fill in the relevant question number box as well.";
    if(type==='ss')
      return fr
        ?"Il vous reste cinq minutes. Assurez-vous de rayer d'un trait toute partie de votre travail que vous ne voulez pas voir prise en compte lors de la notation."
        :"The time remaining is 5 minutes. Please ensure you draw a line through any work that you do not wish to be marked.";
    if(type==='mcq')
      return fr?"Il vous reste cinq minutes.":"The time remaining is five minutes.";
    return null;
  }

  if(event==='end'){
    return fr
      ?"L'épreuve est terminée. Veuillez arrêter d'écrire immédiatement. Il ne vous est pas permis d'ajouter quoi que ce soit à vos réponses ni de les modifier."
      :"The examination has ended. Please stop writing immediately. Do not make any additions or amendments to your answers.";
  }

  return null;
}

// Group announcements by text. For events that include duration (readingEnd),
// group per-timer so extra-time candidates get the correct duration announced.
// Returns array of {text, exams[], timerLabel} where timerLabel is null for exam-level events.
function ibGroupAnnouncements(examList, event, now){
  const groups={}; // text → {exams:[], timerLabel, timerIds:[]}
  // For duration events (readingEnd, examStart), use only the Principal timer
  // so we don't generate separate announcements for extra-time timers
  const durationEvents=['readingEnd','examStart'];

  examList.forEach(exam=>{
    if(durationEvents.includes(event)){
      // Use Principal timer only for duration — fall back to first active timer
      const timer=exam.timers.find(t=>t.label==='Principal'&&!t.done)
        ||exam.timers.find(t=>!t.done)
        ||exam.timers[0];
      const text=ibText(exam.ibType||'ns', event, announceLang, exam, now, timer);
      if(!text)return;
      if(!groups[text])groups[text]={text,items:[]};
      groups[text].items.push({exam,timer:null}); // timer:null = exam-level grouping
    } else {
      const text=ibText(exam.ibType||'ns', event, announceLang, exam, now);
      if(!text)return;
      if(!groups[text])groups[text]={text,items:[]};
      groups[text].items.push({exam,timer:null});
    }
  });

  return Object.values(groups).map(g=>({
    text:g.text,
    exams:[...new Set(g.items.map(i=>i.exam))],
    timers:[],
    timerLabel:null
  }));
}

function ibBuildAnnouncement(group, allRunningExams){
  const fr=announceLang==='fr';
  // If this group covers all running exams → no prefix needed
  if(group.exams.length>=allRunningExams.length) return group.text;
  // Prefix with exam names
  const list=joinList(group.exams.map(e=>e.title||(fr?'Épreuve '+e.id:'Exam '+e.id)),fr);
  return (fr?`Pour ${list} : `:`For ${list}: `)+group.text;
}

function checkStart(){
  const btn=document.getElementById('start-btn');
  if(!btn)return;
  btn.disabled=!examDefs.some(d=>{

    const s=parseInt(document.getElementById('inp-s-'+d.id)?.value)||0;
    return h*3600+m*60+s>0;
  });
}

function makeLogo(size){
  var src=_logoDataURI;
  return '<img src="'+src+'" width="'+size+'" height="'+size+'" alt="Haut-Lac" style="display:block;object-fit:contain;pointer-events:none">';
}
function makeSVG(r,tid,strokeColor){
  r=Math.round(r*_colScale);
  const c=r+9,sz=(r+9)*2,circ=(2*Math.PI*r).toFixed(2),sc=strokeColor||'#1a1a18';
  const ld=Math.max(16,Math.round((r-7)*2*0.82));
  return`<div style="position:relative;width:${sz}px;height:${sz}px;flex-shrink:0">
    <svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="transform:rotate(-90deg);position:absolute;top:0;left:0">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#e8e6e0" stroke-width="6"/>
      <circle id="arc-${tid}" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${sc}" stroke-width="6"
        stroke-dasharray="${circ}" stroke-dashoffset="0" stroke-linecap="round"
        style="transition:stroke-dashoffset .9s linear,stroke .3s"/>
    </svg>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">${makeLogo(ld)}</div>
    <div class="speaking-dot" id="speak-dot-${tid}">🔊</div>
  </div>`;}
function timerState(t){if(t.done)return'done';if(t.left<=alertSecs)return'warning';if(t.left<=ALERT_30)return'near30';return'normal';}
function setArc(tid,left,total,state,r){
  const el=document.getElementById('arc-'+tid);if(!el)return;
  // Use the scaled radius that matches the actual SVG circle drawn by makeSVG
  const scaledR=Math.round(r*_colScale);
  const circ=2*Math.PI*scaledR;
  const pct=total>0?Math.max(0,Math.min(1,left/total)):0;
  el.style.strokeDasharray=circ.toFixed(2);
  el.style.strokeDashoffset=(circ*(1-pct)).toFixed(2);
  el.style.stroke={normal:'#1a1a18',near30:'#1a5abf',warning:'#c0392b',done:'#e8e6e0'}[state]||'#1a1a18';
}

let announceLang='fr';
let selectedVoice=null;
function setLang(l){
  announceLang=l;
  // Update all lang buttons (setup panel + side panel)
  ['fr','en'].forEach(code=>{
    ['lang-'+code, 'panel-lang-'+code].forEach(id=>{
      const btn=document.getElementById(id);if(!btn)return;
      const active=l===code;
      btn.style.background=active?'#3a7bd5':'#fff';

      btn.style.borderColor=active?'#3a7bd5':'#d0cdc6';
      btn.style.fontWeight=active?'500':'400';
    });
  });
  selectedVoice=null;populateVoices();
  if(_voiceSettingsOpen)buildVoiceSettingsPanel();
  if(currentTab==='voice')buildVoiceAlertsPanel();
  savePrefs();
}
function populateVoices(){
  if(!window.speechSynthesis)return;
  const voices=window.speechSynthesis.getVoices();if(!voices.length)return;
  const sel=document.getElementById('voice-select');if(!sel)return;
  const lp=announceLang==='fr'?'fr':'en';
  const filtered=voices.filter(v=>v.lang.toLowerCase().startsWith(lp));
  sel.innerHTML='<option value="">Voix par défaut</option>';
  filtered.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=`${v.name} (${v.lang})`;sel.appendChild(o);});
  sel.onchange=()=>{const name=sel.value;selectedVoice=name?voices.find(v=>v.name===name)||null:null;};
}
if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=populateVoices;populateVoices();}

// Sanitize text for TTS — spell out abbreviations that engines mispronounce
function sanitizeForTTS(text, fr){
  if(!text)return text;
  // Level abbreviations — insert non-breaking spaces so TTS spells them out
  // Both FR (NM/NS) and EN (SL/HL) variants
  // Use SSML-style letter-by-letter: "N M" / "N S" / "S L" / "H L"
  text=text
    .replace(/\bNM\/NS\b/g, fr?'N M, N S':'S L, H L')
    .replace(/\bNM\b/g,     fr?'N M':'S L')
    .replace(/\bNS\b/g,     fr?'N S':'H L')
    .replace(/\bSL\/HL\b/g, fr?'N M, N S':'S L, H L')
    .replace(/\bSL\b/g,     fr?'N M':'S L')
    .replace(/\bHL\b/g,     fr?'N S':'H L');
  return text;
}

function splitIntoChunks(text,maxLen=200){
  const sentences=text.match(/[^.!?]+[.!?]+[\s]*/g)||[text];
  const chunks=[];let current='';
  sentences.forEach(s=>{if((current+s).length>maxLen&&current.length>0){chunks.push(current.trim());current=s;}else{current+=s;}});
  if(current.trim())chunks.push(current.trim());
  return chunks.length?chunks:[text];
}
// ── SPEECH ENGINE ──
let _speechQueue=[];
let _speechBusy=false;
let _speechWatchdog=null;

function _resetSpeech(){
  _speechBusy=false;
  if(_speechWatchdog){clearTimeout(_speechWatchdog);_speechWatchdog=null;}
}

function _processQueue(){
  if(_speechBusy||_speechQueue.length===0){
    if(!_speechBusy&&_speechQueue.length===0)hideSpeaking();
    return;
  }
  if(!window.speechSynthesis)return;
  _speechBusy=true;
  const {chunks,langCode,voice,examIds,timerIds}=_speechQueue.shift();
  if(typeof showSpeaking==='function')showSpeaking(examIds||null, timerIds||null);
  _speakChunksQueued(chunks,langCode,voice,0);
}

function _speakChunksQueued(chunks,langCode,voice,idx){
  if(idx>=chunks.length){
    _resetSpeech();
    setTimeout(_processQueue,150);
    return;
  }
  if(!window.speechSynthesis){_resetSpeech();return;}
  const u=new SpeechSynthesisUtterance(chunks[idx]);
  u.lang=langCode==='en'?'en-GB':'fr-FR';
  u.rate=0.95;u.pitch=1;u.volume=1;
  if(voice)u.voice=voice;
  u.onend=()=>{
    if(_speechWatchdog){clearTimeout(_speechWatchdog);_speechWatchdog=null;}
    _speakChunksQueued(chunks,langCode,voice,idx+1);
  };
  u.onerror=()=>{_resetSpeech();hideSpeaking();setTimeout(_processQueue,150);};
  _speechWatchdog=setTimeout(()=>{_resetSpeech();hideSpeaking();setTimeout(_processQueue,150);},30000);
  try{window.speechSynthesis.speak(u);}catch(e){_resetSpeech();hideSpeaking();}
}

let _warmingUp=false;
function warmUpSpeech(){
  if(!window.speechSynthesis||_warmingUp)return;
  _warmingUp=true;
  try{
    window.speechSynthesis.cancel(); // clear any stuck state
    const u=new SpeechSynthesisUtterance('\u200B'); // zero-width space
    u.volume=0;
    u.onend=u.onerror=()=>{_warmingUp=false;};
    window.speechSynthesis.speak(u);
  }catch(e){_warmingUp=false;}
}

document.addEventListener('touchstart',warmUpSpeech,{passive:true});
document.addEventListener('mousedown',warmUpSpeech,{passive:true});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    _resetSpeech(); // reset in case browser killed speech in background
    if(intervalId&&!paused)acquireWakeLock();
    if(typeof _audioCtx!=='undefined'&&_audioCtx&&_audioCtx.state==='suspended')_audioCtx.resume().catch(()=>{});
  }
});

function announce(text,{interrupt=false,examIds=null,timerIds=null}={}){
  if(audioMode!=='voice'||!window.speechSynthesis||!text)return;
  text=sanitizeForTTS(text, announceLang==='fr');
  const voice=selectedVoice||(()=>{
    const vv=window.speechSynthesis.getVoices();
    if(announceLang==='en'){
      // Prefer British, fall back to US, then any English
      return vv.find(v=>v.lang.toLowerCase().startsWith('en-gb')&&v.localService)
          ||vv.find(v=>v.lang.toLowerCase().startsWith('en-gb'))
          ||vv.find(v=>v.lang.toLowerCase().startsWith('en-us')&&v.localService)
          ||vv.find(v=>v.lang.toLowerCase().startsWith('en'))
          ||null;
    }
    return vv.find(v=>v.lang.toLowerCase().startsWith('fr')&&v.localService)
        ||vv.find(v=>v.lang.toLowerCase().startsWith('fr'))
        ||null;
  })();
  const chunks=splitIntoChunks(text);
  if(interrupt){
    _speechQueue=[];
    try{window.speechSynthesis.cancel();}catch(e){}
    _resetSpeech();
    hideSpeaking();
  }
  _speechQueue.push({chunks,langCode:announceLang,voice,examIds,timerIds});
  setTimeout(_processQueue,interrupt?100:0);
}

let _audioCtx=null;
function getAudioCtx(){if(!_audioCtx){try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}return _audioCtx;}
function unlockAudio(){const c=getAudioCtx();if(c&&c.state!=='running')c.resume().catch(()=>{});}
document.addEventListener('touchstart',unlockAudio,{passive:true});
document.addEventListener('mousedown',unlockAudio,{passive:true});
function _playBeep(C,f,d,v){try{const o=C.createOscillator(),g=C.createGain();o.connect(g);g.connect(C.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,C.currentTime);g.gain.exponentialRampToValueAtTime(0.001,C.currentTime+d);o.start();o.stop(C.currentTime+d);}catch(e){}}
function beep(f,d,v=0.3){try{const C=getAudioCtx();if(!C)return;if(C.state==='running'){_playBeep(C,f,d,v);}else{C.resume().then(()=>_playBeep(C,f,d,v)).catch(()=>{});}}catch(e){}}

function showSpeaking(examIds, timerIds){

    const targets=examIds
      ?exams.filter(e=>examIds.includes(e.id))

}

function joinList(arr,fr){if(arr.length===1)return arr[0];const conj=fr?' et ':' and ';return arr.slice(0,-1).join(', ')+conj+arr[arr.length-1];}

function buildAlertText(minutes, timerContexts){
  const fr=announceLang==='fr';
  const minText=fr?(minutes<=1?'une minute':`${minutes} minutes`):(minutes<=1?'one minute':`${minutes} minutes`);
  const base=fr?`Il reste ${minText}.`:`${minutes<=1?'One minute':minText} remaining.`;
  if(!timerContexts||timerContexts.length===0)return base;

  const runningExams=exams.filter(e=>e.status==='running');
  const multipleExams=runningExams.length>1;
  const totalActiveTimers=runningExams.reduce((n,e)=>n+e.timers.filter(t=>!t.done).length,0);
  const hasExtra=timerContexts.some(c=>c.isExtra);
  // No prefix needed if all timers are alerting and none are extra
  if(!multipleExams&&!hasExtra)return base;
  if(timerContexts.length===totalActiveTimers&&!hasExtra)return base;

  // Build prefix: group by exam
  const examGroups={};
  timerContexts.forEach(({examTitle,timerLabel,isExtra})=>{
    if(!examGroups[examTitle])examGroups[examTitle]=[];
    if(isExtra)examGroups[examTitle].push(timerLabel);
  });
  const allExamsCovered=Object.keys(examGroups).length>=runningExams.length;

  const parts=Object.entries(examGroups).map(([title,extras])=>{
    if(allExamsCovered){
      // No exam names — only mention extra time if applicable
      return extras.length?(fr?`temps supplémentaire de ${joinList(extras.map(function(x){return fmtSpokenLabel(x,fr);}),fr)}`:`additional time of ${joinList(extras.map(function(x){return fmtSpokenLabel(x,fr);}),fr)}`):null;
    }
    if(extras.length)return fr?`${title}, temps supplémentaire de ${joinList(extras.map(function(x){return fmtSpokenLabel(x,fr);}),fr)}`:`${title}, additional time of ${joinList(extras.map(function(x){return fmtSpokenLabel(x,fr);}),fr)}`;
    return title;
  }).filter(Boolean);

  if(parts.length===0)return base;
  const prefix=fr
    ?(parts.every(p=>p.startsWith('temps'))?`Pour le ${joinList(parts,fr)} : `:`Pour ${joinList(parts,fr)} : `)
    :`For ${joinList(parts,fr)}: `;
  return prefix+base;
}

function buildCombinedEndText(endBatch){
  const fr=announceLang==='fr';
  const base=fr?"Le temps est écoulé.":"Time is up.";
  if(endBatch.length===0)return base;

  const runningExams=exams.filter(e=>e.status==='running');
  const multipleExams=runningExams.length>1;
  const totalTimers=runningExams.reduce((n,e)=>n+e.timers.length,0);
  const anyExtra=endBatch.some(({timer})=>timer.label!=='Principal');
  if(endBatch.length>=totalTimers&&!anyExtra)return base;

  const groups={};
  endBatch.forEach(({exam,timer})=>{
    if(!groups[exam.title])groups[exam.title]=[];
    if(timer.label!=='Principal')groups[exam.title].push(timer.label);
  });
  const allExamsCovered=Object.keys(groups).length>=runningExams.length;

  const parts=Object.entries(groups).map(([title,extras])=>{
    if(allExamsCovered){
      return extras.length?(fr?`temps supplémentaire de ${joinList(extras.map(function(x){return fmtSpokenLabel(x,fr);}),fr)}`:`additional time of ${joinList(extras.map(function(x){return fmtSpokenLabel(x,fr);}),fr)}`):null;
    }
    if(extras.length)return fr?`${title}, temps supplémentaire de ${joinList(extras.map(function(x){return fmtSpokenLabel(x,fr);}),fr)}`:`${title}, additional time of ${joinList(extras.map(function(x){return fmtSpokenLabel(x,fr);}),fr)}`;
    return title;
  }).filter(Boolean);

  if(parts.length===0)return base;
  const prefix2=fr
    ?(parts.every(p=>p.startsWith('temps'))?`Pour le ${joinList(parts,fr)} : `:`Pour ${joinList(parts,fr)} : `)
    :`For ${joinList(parts,fr)}: `;
  return prefix2+base;
}

function ibBuildRow(a){return{date:a[0],dateEN:a[1],sessFR:a[2],sessEN:a[3],mFR:a[4],mEN:a[5],lvl:a[6],paper:a[7],grpFR:a[8],grpEN:a[9],typeFR:a[10],typeEN:a[11],duree:a[12],notesFR:a[13],notesEN:a[14]};}

// ── IB rows (editable, persisted in localStorage) ──
let _ibRows=null;
function ibGetRows(){
  if(_ibRows)return _ibRows;
  try{const s=localStorage.getItem('hl-ib-rows');if(s){_ibRows=JSON.parse(s);return _ibRows;}}catch{}
  _ibRows=IB_RAW_DEFAULT.map(ibBuildRow);
  return _ibRows;
}
function ibSaveRows(){try{localStorage.setItem('hl-ib-rows',JSON.stringify(_ibRows||[]));} catch{}}

// ── Date helpers ──
function ibParseDate(s){
  if(!s||!s.trim())return null;
  const m=s.trim().match(/^(\d{1,2})[\/\-\.](\d{1,2})(?:[\/\-\.](\d{2,4}))?/);
  return m?{d:parseInt(m[1]),mo:parseInt(m[2]),yr:m[3]?parseInt(m[3]):null}:null;
}
function ibDateToInt(s){const p=ibParseDate(s);return p?((p.yr||0)*10000+p.mo*100+p.d):null;}
function ibDefaultDateFrom(){const n=new Date();return String(n.getDate()).padStart(2,'0')+'/'+String(n.getMonth()+1).padStart(2,'0')+'/'+n.getFullYear();}
function ibDefaultDateTo(){const n=new Date(Date.now()+7*86400000);return String(n.getDate()).padStart(2,'0')+'/'+String(n.getMonth()+1).padStart(2,'0')+'/'+n.getFullYear();}

// ── Picker filter ──
function ibPickerFilter(eid){
  const def=examDefs.find(e=>e.id===eid);if(!def)return;
  const dateFrom=document.getElementById('ib-pf-date-'+eid)?.value||'';
  const dateTo=document.getElementById('ib-pf-date2-'+eid)?.value||'';
  const q=(document.getElementById('ib-pf-q-'+eid)?.value||'').toLowerCase().trim();
  const lvl=document.getElementById('ib-pf-lvl-'+eid)?.value||'';
  const sess=document.getElementById('ib-pf-sess-'+eid)?.value||'';
  def._ibDateFrom=dateFrom; def._ibDateTo=dateTo; def._ibQuery=q;

  // Mark active
  ['ib-pf-date-'+eid,'ib-pf-date2-'+eid,'ib-pf-q-'+eid,'ib-pf-lvl-'+eid,'ib-pf-sess-'+eid].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.classList.toggle('active',!!(el.value&&el.value.trim()));
  });

  const res=document.getElementById('ib-res-'+eid);if(!res)return;
  const rows=ibGetRows();
  const fromInt=ibDateToInt(dateFrom);
  const toInt=ibDateToInt(dateTo);
  const fr=announceLang==='fr'||uiLang==='fr';

  const filtered=rows.filter(r=>{
    const rd=ibDateToInt(r.date);
    if(rd&&fromInt&&rd<fromInt)return false;
    if(rd&&toInt&&rd>toInt)return false;
    if(lvl&&r.lvl!==lvl)return false;
    if(sess&&r.sessFR!==sess)return false;
    if(q){
      const hay=(r.mFR+' '+r.mEN+' '+r.paper).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  }).sort((a,b)=>(ibDateToInt(a.date)||0)-(ibDateToInt(b.date)||0)).slice(0,30);

  if(!filtered.length){
    res.innerHTML='<div class="ib-result-empty">'+(fr?'Aucun résultat':'No results')+'</div>';
    return;
  }

  res.innerHTML=filtered.map((r,i)=>{
    const subj=fr?r.mFR:r.mEN;
    const lvlDisp=fr?r.lvl:(IB_LEVEL_FR2EN[r.lvl]||r.lvl);
    const dur=r.duree?(r.duree+' min'):'—';
    return '<div class="ib-result-item" onclick="ibPickerSelect('+eid+','+rows.indexOf(r)+')">'
      +'<span class="ib-result-date">'+r.date+'</span>'
      +'<span class="ib-result-subject">'+escHtml(subj)+'</span>'
      +'<span class="ib-result-paper">'+escHtml(r.paper)+'</span>'
      +'<span class="ib-result-lvl">'+escHtml(lvlDisp)+'</span>'
      +'<span class="ib-result-dur">'+dur+'</span>'
      +'</div>';
  }).join('');
}

function ibPickerSelect(eid,rowIdx){
  const def=examDefs.find(e=>e.id===eid);if(!def)return;
  const rows=ibGetRows();
  const r=rows[rowIdx];if(!r)return;
  const fr=announceLang==='fr'||uiLang==='fr';

  // Build title: Subject Paper Level
  const subj=fr?r.mFR:r.mEN;
  const lvlDisp=fr?r.lvl:(IB_LEVEL_FR2EN[r.lvl]||r.lvl);
  const title=subj+' '+r.paper+' '+lvlDisp;

  // Set minutes from duration
  const mins=parseInt(r.duree)||0;

  // Map IB type → timer ibType and reading
  const ibType=ibTypeToTimerType(r.typeFR);
  const hasReading=ibTypeHasReading(r.typeFR);

  // Apply to examDef — set duration BEFORE renderExamList reads it back
  // We must set _h/_m/_s AFTER renderExamList saves the DOM (which happens at render start)
  // So we set title/ibType/readingOn now, re-render, then directly set the input values
  def.title=title;
  def.ibType=ibType;
  def.readingOn=hasReading;
  def._ibSelected=subj+' '+r.paper+' '+lvlDisp;

  // Re-render (this will save old _m/_h/_s from DOM, then build new DOM with old values)
  renderExamList();

  // Now directly set the duration inputs to the IB exam duration
  const inpH=document.getElementById('inp-h-'+eid);
  const inpM=document.getElementById('inp-m-'+eid);
  const inpS=document.getElementById('inp-s-'+eid);
  if(inpH){inpH.value='0';def._h='0';}
  if(inpM){inpM.value=String(mins);def._m=String(mins);}
  if(inpS){inpS.value='0';def._s='0';}

  checkStart();
}

function ibClearSelection(eid){
  const def=examDefs.find(e=>e.id===eid);if(!def)return;
  def._ibSelected=null;
  renderExamList();
}

    +'</select>';
}

function ibFilteredRows(){
  const f=_ibModalFilters;
  const fromInt=ibDateToInt(f.dateFrom);
  const toInt=ibDateToInt(f.dateTo);
  const q=(f.q||'').toLowerCase().trim();
  return ibGetRows().filter(r=>{
    const rd=ibDateToInt(r.date);
    if(rd&&fromInt&&rd<fromInt)return false;
    if(rd&&toInt&&rd>toInt)return false;
    if(f.lvl&&r.lvl!==f.lvl)return false;
    if(q&&!(r.mFR+' '+r.mEN+' '+r.paper).toLowerCase().includes(q))return false;
    return true;
  });
}

// ── Date picker ──
let _ibDpTarget=null; // {input, eid, which:'from'|'to'}
let _ibDpYear=2027;
let _ibDpMonth=4; // 1-based, defaults to April 2027

function ibShowDatePicker(input,eid,which){
  // Remove any existing picker
  ibHideDatePicker();

  // Parse current value to set calendar month
  const val=input.value;
  const p=val.match(/^(\d{1,2})\/(\d{1,2})/);
  const now=new Date();
  _ibDpYear=p?now.getFullYear():now.getFullYear();
  _ibDpMonth=p?parseInt(p[2]):(now.getMonth()+1);
  // If parsed month, use it (assume 2027 session months: 4=April, 5=May)
  if(p)_ibDpMonth=parseInt(p[2]);

  _ibDpTarget={input,eid,which};

  const dp=document.createElement('div');
  dp.id='ib-datepicker';dp.className='ib-datepicker';
  document.body.appendChild(dp);
  ibRenderDatePicker();

  // Position near input
  const rect=input.getBoundingClientRect();
  dp.style.top=(rect.bottom+4)+'px';
  dp.style.left=rect.left+'px';
  if(rect.left+dp.offsetWidth>window.innerWidth-10)
    dp.style.left=Math.max(4,window.innerWidth-dp.offsetWidth-10)+'px';

  // Close on outside click
  setTimeout(()=>document.addEventListener('mousedown',ibDpOutside),0);
}

function ibDpOutside(e){
  const dp=document.getElementById('ib-datepicker');
  if(dp&&!dp.contains(e.target)&&e.target!==_ibDpTarget?.input){
    ibHideDatePicker();
  }
}
function ibHideDatePicker(){
  const dp=document.getElementById('ib-datepicker');
  if(dp)dp.remove();
  document.removeEventListener('mousedown',ibDpOutside);
  _ibDpTarget=null;
}

function ibRenderDatePicker(){
  const dp=document.getElementById('ib-datepicker');if(!dp)return;
  const fr=uiLang==='fr';
  const months=fr?['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre']
               :['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dows=fr?['L','M','M','J','V','S','D']:['M','T','W','T','F','S','S'];

  // Get exam dates for this month (to highlight)
  const rows=ibGetRows();
  const examDaysThisMonth=new Set();
  rows.forEach(r=>{
    const p=r.date&&r.date.match(/^(\d{1,2})\/(\d{1,2})/);
    if(p&&parseInt(p[2])===_ibDpMonth)examDaysThisMonth.add(parseInt(p[1]));
  });

  // Parse selected date
  let selDay=null,selMo=null;
  if(_ibDpTarget){
    const v=_ibDpTarget.input.value;
    const p=v.match(/^(\d{1,2})\/(\d{1,2})/);
    if(p){selDay=parseInt(p[1]);selMo=parseInt(p[2]);}
  }
  const today=new Date();
  const todayD=today.getDate(),todayMo=today.getMonth()+1;

  // Build calendar grid
  const firstDay=new Date(_ibDpYear,_ibDpMonth-1,1).getDay(); // 0=Sun
  const adjFirst=(firstDay+6)%7; // Monday=0
  const daysInMonth=new Date(_ibDpYear,_ibDpMonth,0).getDate();
  const daysInPrev=new Date(_ibDpYear,_ibDpMonth-1,0).getDate();

  let cells='';
  dows.forEach(d=>{cells+='<div class="ib-dp-dow">'+d+'</div>';});

  // Prev month overflow
  for(let i=0;i<adjFirst;i++){
    const d=daysInPrev-adjFirst+1+i;
    cells+='<div class="ib-dp-day other">'+d+'</div>';
  }
  // This month
  for(let d=1;d<=daysInMonth;d++){
    let cls='ib-dp-day';
    if(d===todayD&&_ibDpMonth===todayMo)cls+=' today';
    if(d===selDay&&_ibDpMonth===selMo)cls+=' selected';
    if(examDaysThisMonth.has(d))cls+=' exam';
    cells+='<div class="'+cls+'" onclick="ibDpSelectDay('+d+')">'+d+'</div>';
  }
  // Next month overflow
  const total=adjFirst+daysInMonth;
  const remaining=(7-total%7)%7;
  for(let d=1;d<=remaining;d++)cells+='<div class="ib-dp-day other">'+d+'</div>';

  // Shortcuts
  const shortcuts=fr
    ?[['Aujourd\'hui',0],['Demain',1],['+7j',7],['+14j',14]]
    :[['Today',0],['Tomorrow',1],['+7d',7],['+14d',14]];
  const shortBtns=shortcuts.map(([lbl,days])=>
    '<button onclick="ibDpShortcut('+days+')">'+lbl+'</button>').join('');

  dp.innerHTML=
    '<div class="ib-dp-head">'
    +'<button class="ib-dp-nav" onclick="ibDpNav(-1)">‹</button>'
    +'<span class="ib-dp-title">'+months[_ibDpMonth-1]+' '+_ibDpYear+'</span>'
    +'<button class="ib-dp-nav" onclick="ibDpNav(1)">›</button>'
    +'</div>'
    +'<div class="ib-dp-grid">'+cells+'</div>'
    +'<div class="ib-dp-shortcuts">'+shortBtns+'</div>';
}

function ibDpNav(dir){
  _ibDpMonth+=dir;
  if(_ibDpMonth>12){_ibDpMonth=1;_ibDpYear++;}
  if(_ibDpMonth<1){_ibDpMonth=12;_ibDpYear--;}
  ibRenderDatePicker();
  // Reposition
  if(_ibDpTarget){
    const dp=document.getElementById('ib-datepicker');
    const rect=_ibDpTarget.input.getBoundingClientRect();
    if(dp){dp.style.top=(rect.bottom+4)+'px';dp.style.left=rect.left+'px';}
  }
}

function ibDpSelectDay(d){
  if(!_ibDpTarget)return;
  const val=String(d).padStart(2,'0')+'/'+String(_ibDpMonth).padStart(2,'0')+'/'+_ibDpYear;
  _ibDpTarget.input.value=val;
  if(_ibDpTarget.isPanel){
    buildAddPanelFilter();
  } else {
    const eid=_ibDpTarget.eid;
    const which=_ibDpTarget.which;
    const def=examDefs.find(e=>e.id===eid);
    if(def){if(which==='from')def._ibDateFrom=val;else def._ibDateTo=val;}
    ibPickerFilter(eid);
  }
  ibHideDatePicker();
}

function ibDpShortcut(daysAhead){
  if(!_ibDpTarget)return;
  const d=new Date(Date.now()+daysAhead*86400000);
  const val=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  _ibDpTarget.input.value=val;
  _ibDpYear=d.getFullYear();_ibDpMonth=d.getMonth()+1;
  ibRenderDatePicker();
  if(_ibDpTarget.isPanel){
    buildAddPanelFilter();
  } else {
    const eid=_ibDpTarget.eid,which=_ibDpTarget.which;
    const def=examDefs.find(e=>e.id===eid);
    if(def){if(which==='from')def._ibDateFrom=val;else def._ibDateTo=val;}
    ibPickerFilter(eid);
  }
}

function ibRenderModalTable(){
  const fr=_ibModalLang==='fr';
  const rows=ibGetRows();
  const vis=ibFilteredRows();

  const count=document.getElementById('ib-modal-count');
  if(count)count.textContent=vis.length+' / '+rows.length+(fr?' épreuves':' papers');

  // Head
  const heads=fr
    ?['Date','Session','Matière (FR)','Matière (EN)','Niveau','Épreuve','Groupe','Type','Durée (min)','Notes']
    :['Date','Session','Subject (FR)','Subject (EN)','Level','Paper','Group','Type','Duration (min)','Notes'];
  const allVisChecked=vis.length>0&&vis.every(r=>_ibSelected.has(rows.indexOf(r)));
  document.getElementById('ib-tbl-head').innerHTML='<tr>'
    +'<th class="cb-col"><input type="checkbox" '+(allVisChecked?'checked':'')
    +' onchange="ibToggleAll(this.checked)" title="'+(fr?'Tout sélectionner':'Select all')+'"></th>'
    +heads.map((h,i)=>'<th style="min-width:'+(i===2||i===3?130:i===6?110:i===7?100:70)+'px">'+h+'</th>').join('')
    +'<th style="width:30px"></th></tr>';

  // Body
  const tOpts=(fr?IB_TYPES_FR:IB_TYPES_EN).map((t,i)=>({vFR:IB_TYPES_FR[i],label:t}));
  const gOpts=(fr?IB_GROUPS_FR:IB_GROUPS_EN).map((g,i)=>({vFR:IB_GROUPS_FR[i],label:g}));
  const sOpts=(fr?IB_SESSIONS_FR:IB_SESSIONS_EN).map((s,i)=>({vFR:IB_SESSIONS_FR[i],label:s}));

  document.getElementById('ib-tbl-body').innerHTML=vis.map(r=>{
    const ri=rows.indexOf(r);
    const lvlOpts=IB_LEVELS_FR.map((lFR,li)=>{
      const disp=fr?lFR:IB_LEVELS_EN[li];
      return '<option value="'+lFR+'"'+(r.lvl===lFR?' selected':'')+'>'+disp+'</option>';
    }).join('');
    const c=IB_GRP_COLOR[r.grpFR]||'#ccc';
    const isChecked=_ibSelected.has(ri);
    return '<tr>'
      +'<td class="cb-col"><input type="checkbox" '+(isChecked?'checked':'')+' onchange="ibToggleRow('+ri+',this.checked)"></td>'
      +'<td><input value="'+escHtml(r.date)+'" onchange="ibRows_edit('+ri+',\'date\',this.value)" style="min-width:60px"></td>'
      +'<td><select onchange="ibRows_syncSess('+ri+',this.value)">'+sOpts.map(o=>'<option value="'+escHtml(o.vFR)+'"'+(r.sessFR===o.vFR?' selected':'')+'>'+o.label+'</option>').join('')+'</select></td>'
      +'<td><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+c+';margin:0 4px 0 6px;vertical-align:middle;flex-shrink:0"></span>'
      +'<input value="'+escHtml(r.mFR)+'" onchange="ibRows_edit('+ri+',\'mFR\',this.value)" style="width:calc(100% - 20px);display:inline-block"></td>'
      +'<td><input value="'+escHtml(r.mEN)+'" onchange="ibRows_edit('+ri+',\'mEN\',this.value)"></td>'
      +'<td><select onchange="ibRows_editLvl('+ri+',this.value)">'+lvlOpts+'</select></td>'
      +'<td><input value="'+escHtml(r.paper)+'" onchange="ibRows_edit('+ri+',\'paper\',this.value)"></td>'
      +'<td><select onchange="ibRows_syncGrp('+ri+',this.value)">'+gOpts.map(o=>'<option value="'+escHtml(o.vFR)+'"'+(r.grpFR===o.vFR?' selected':'')+'>'+o.label+'</option>').join('')+'</select></td>'
      +'<td><select onchange="ibRows_syncType('+ri+',this.value)">'+tOpts.map(o=>'<option value="'+escHtml(o.vFR)+'"'+(r.typeFR===o.vFR?' selected':'')+'>'+o.label+'</option>').join('')+'</select></td>'
      +'<td><input type="number" value="'+escHtml(r.duree||'')+'" min="0" onchange="ibRows_edit('+ri+',\'duree\',this.value)" style="text-align:center;min-width:50px"></td>'
      +'<td><input value="'+escHtml(fr?r.notesFR:r.notesEN)+'" onchange="ibRows_edit('+ri+','+(fr?'\'notesFR\'':'\'notesEN\'')+',this.value)"></td>'
      +'<td><button onclick="ibRows_del('+ri+')" style="background:none;border:none;cursor:pointer;color:#aaa;font-size:14px;padding:4px 7px;border-radius:4px" title="Supprimer">✕</button></td>'
      +'</tr>';
  }).join('');
}

function ibRows_edit(ri,key,val){ibGetRows()[ri][key]=val;ibSaveRows();}
function ibRows_editLvl(ri,vFR){ibGetRows()[ri].lvl=vFR;ibSaveRows();}
function ibRows_syncSess(ri,vFR){const i=IB_SESSIONS_FR.indexOf(vFR);const r=ibGetRows()[ri];r.sessFR=vFR;r.sessEN=i>=0?IB_SESSIONS_EN[i]:vFR;ibSaveRows();}
function ibRows_syncGrp(ri,vFR){const i=IB_GROUPS_FR.indexOf(vFR);const r=ibGetRows()[ri];r.grpFR=vFR;r.grpEN=i>=0?IB_GROUPS_EN[i]:vFR;ibSaveRows();}
function ibRows_syncType(ri,vFR){const i=IB_TYPES_FR.indexOf(vFR);const r=ibGetRows()[ri];r.typeFR=vFR;r.typeEN=i>=0?IB_TYPES_EN[i]:vFR;ibSaveRows();ibRenderModalTable();}
function ibRows_del(ri){if(!confirm(uiLang==='fr'?'Supprimer cette ligne ?':'Delete this row?'))return;ibGetRows().splice(ri,1);ibSaveRows();ibRenderModalTable();}

function ibAddRow(){
  // Clear filters so the new row is visible
  _ibModalFilters={dateFrom:'',dateTo:'',q:'',lvl:''};
  ibGetRows().push({date:'',dateEN:'',sessFR:'',sessEN:'',mFR:'',mEN:'',lvl:'NM',paper:'',grpFR:'',grpEN:'',typeFR:'Non structuré',typeEN:'Unstructured',duree:'',notesFR:'',notesEN:''});
  ibSaveRows();
  ibRenderModalFbar(); // rebuild filter bar to show cleared state
  ibRenderModalTable();
  setTimeout(()=>{const body=document.querySelector('.ib-modal-body');if(body)body.scrollTop=body.scrollHeight;},50);
}

function ibResetToDefault(){
  const fr=uiLang==='fr';
  if(!confirm(fr?'Rétablir la liste par défaut IB 2027 ? Les modifications seront perdues.':'Reset to default IB 2027 list? All edits will be lost.'))return;
  _ibRows=IB_RAW_DEFAULT.map(ibBuildRow);
  _ibSelected.clear();
  ibSaveRows();ibUpdateSelBar();ibRenderModalTable();
}

<h3>Programme IB</h3><p>Le bouton 📋 Programme IB ouvre un gestionnaire de calendrier. Importez un fichier CSV (exporté ou créé avec l'aide d'une IA) pour remplir automatiquement les épreuves.</p>`},

    alerts:{title:'Alertes sonores',html:`<p>Deux alertes configurables avant la fin de chaque minuteur.</p><ul><li><strong>Première alerte</strong> — 30 min par défaut. Modifiez ou désactivez.</li><li><strong>Deuxième alerte</strong> — 5 min par défaut.</li><li><strong>Son</strong> : bip. <strong>Voix</strong> : annonce lue.</li><li>Les repères sur les cercles se mettent à jour automatiquement.</li></ul>`},
    exams:{title:'Gestion des épreuves',html:`<p>Chaque carte = une épreuve avec ses propres minuteurs (Principal, +25%, +50%).</p><ul><li><strong>Nom</strong> — Tapez ou sélectionnez via le sélecteur IB.</li><li><strong>Durée</strong> — H / Min / Sec pour le temps principal.</li><li><strong>Temps supplémentaire</strong> — +25% et/ou +50% calculés automatiquement.</li><li><strong>Temps de lecture</strong> — Activable par épreuve.</li><li><strong>Type IB</strong> — Détermine les annonces officielles.</li></ul>`},
    examTitle:{title:"Nom de l'épreuve",html:`<p>Le nom saisi s'affiche <strong>au-dessus du minuteur</strong> de cette épreuve.</p><ul><li>En mode <strong>Voix</strong>, le nom est utilisé dans les annonces pour distinguer les examens — ex. <em>"Pour Mathématiques NS 1 : L'examen commence…"</em></li><li>Le <strong>sélecteur IB</strong> ci-dessous remplit automatiquement le nom (matière + épreuve + niveau), la durée, le type d'annonce et le temps de lecture selon les standards IB.</li></ul>`},
    extraTime:{title:'Temps supplémentaire',html:`<p>Minuteurs séparés pour les candidats ayant droit à du temps additionnel.</p><ul><li><strong>Principal</strong> — toujours actif, durée standard de l'examen.</li><li><strong>+25%</strong> et <strong>+50%</strong> — si activés, démarrent <strong>en même temps</strong> que le Principal et durent proportionnellement plus longtemps. Affichés sous le timer Principal dans la même colonne.</li><li>Vous pouvez entrer un <strong>pourcentage</strong> (ex. <code>25%</code>), une <strong>proportion décimale</strong> (ex. <code>0.5</code> = 50%) ou une <strong>fraction</strong> (ex. <code>1/3</code> = tiers-temps).</li><li>Cercles et annonces vocales sont indépendants pour chaque timer.</li></ul>`},
    addExam:{title:"Ajouter un examen",html:`<p>Le bouton <strong>＋ Ajouter un examen</strong> ajoute une nouvelle carte d'épreuve sous les existantes.</p><ul><li>Vous pouvez configurer le nom, la durée, le temps supplémentaire et le temps de lecture pour chaque épreuve indépendamment.</li><li>Pendant que les minuteurs sont en marche, utilisez le bouton ⚙ (en haut à droite) → onglet <strong>Ajouter un examen</strong> pour ajouter une épreuve sans interrompre les autres.</li><li>Le sélecteur IB intégré vous permet de chercher et sélectionner une épreuve du programme, ce qui remplit automatiquement tous les champs.</li></ul>`},
    alert1:{title:'Première alerte',html:`<p>Déclenchée automatiquement avant la fin de chaque minuteur.</p><ul><li>Par défaut : <strong>30 minutes</strong> avant la fin.</li><li>Changez la valeur en tapant une nouvelle durée dans le champ.</li><li>Désactivez avec l'interrupteur à droite.</li><li>En mode <strong>Son</strong> : un bip est émis. En mode <strong>Voix</strong> : une annonce est lue (ex. <em>"Il vous reste 30 minutes."</em>).</li><li>Un repère <code>−30</code> apparaît sur les cercles à la position correspondante et se met à jour si vous changez la durée.</li></ul>`},
    alert2:{title:'Deuxième alerte',html:`<p>Deuxième alerte automatique avant la fin de chaque minuteur.</p><ul><li>Par défaut : <strong>5 minutes</strong> avant la fin.</li><li>Changez la valeur ou désactivez avec l'interrupteur.</li><li>Fonctionne comme la première alerte — bip ou annonce vocale selon le mode audio.</li><li>Le repère <code>−5</code> sur les cercles indique visuellement ce moment.</li></ul>`},
    logo:{title:'Logo dans les cercles',html:`<p>Un logo s'affiche au centre de chaque cercle de minuteur.</p><ul><li>Par défaut : le logo Haut-Lac.</li><li>Cliquez <strong>Changer</strong> pour télécharger votre propre image (JPG, PNG ou SVG).</li><li>Le bouton <strong>↺</strong> rétablit le logo original.</li><li>Le logo personnalisé est enregistré dans le navigateur et réapparaît à la prochaine ouverture.</li><li>Le logo s'adapte automatiquement à la taille des cercles.</li></ul>`},
    audioMode:{title:'Mode audio',html:`<p>Contrôle le type de son émis par le logiciel.</p><ul><li><strong>🔇 Silence</strong> — Aucun son, aucune annonce. Utile si vous gérez les annonces vous-même.</li><li><strong>🔔 Son</strong> — Un bip sonore est émis aux alertes et à la fin de chaque minuteur.</li><li><strong>🗣 Voix</strong> — Des annonces vocales sont lues automatiquement. Des options supplémentaires apparaissent : langue, voix, mode IB, personnalisation.</li></ul>`},
    announceLang:{title:'Langue des annonces',html:`<p>La langue des annonces vocales est <strong>indépendante</strong> de la langue de l'interface.</p><ul><li>Choisissez <strong>FR</strong> pour les annonces en français ou <strong>EN</strong> pour l'anglais.</li><li>Cela n'affecte pas les étiquettes de l'interface — seulement ce qui est lu à voix haute.</li><li>Vous pouvez aussi choisir la voix spécifique parmi les voix disponibles sur votre appareil dans le sélecteur <em>Voix</em> juste en dessous.</li></ul>`},
    ibAnnounce:{title:'Annonces IB officielles',html:`<p>Lorsque ce mode est activé, les annonces vocales utilisent les <strong>textes officiels du Baccalauréat International</strong>.</p><ul><li>Les textes varient selon le type d'épreuve (structurée, QCM, compréhension orale, etc.).</li><li>Les annonces sont faites en français ou en anglais selon la langue choisie.</li><li>Ce mode est recommandé pour les examens IB officiels. Pour les examens internes ou d'autres systèmes, utilisez le mode personnalisé.</li><li>Désactivez ce mode pour utiliser les annonces personnalisées à la place.</li></ul>`},
    customAnnounce:{title:'Personnaliser les annonces',html:`<p>Modifiez le texte de chaque annonce vocale pour l'adapter à vos besoins.</p><ul><li>Cliquez sur <strong>Personnaliser les annonces</strong> pour ouvrir le panneau de modification.</li><li>Six événements sont personnalisables : début lecture, fin lecture, début examen, alerte 30 min, alerte 5 min, fin examen.</li><li>Utilisez des tokens dynamiques dans vos textes :<ul><li><code>{duree}</code> — durée de l'examen (ex. "90 minutes")</li><li><code>{heure}</code> — heure actuelle</li><li><code>{restant}</code> — temps restant</li><li><code>{lecture}</code> — durée du temps de lecture</li></ul></li><li>Si plusieurs examens ont des durées différentes, les annonces sont automatiquement groupées et préfixées du nom de l'épreuve.</li></ul>`},
    dates:{title:'Sélectionner des examens IB',html:`<p>Les filtres sous le nom permettent de chercher un examen et de remplir automatiquement nom, durée et type.</p><ul><li><strong>Date depuis / jusqu'à</strong> — filtrez par période. Cliquez pour ouvrir le calendrier ; les jours avec examens sont surlignés.</li><li><strong>Session</strong> — Matin ou Après-midi.</li><li><strong>Niveau</strong> — NM (SL) ou NS (HL).</li><li><strong>Recherche</strong> — tapez le début du nom de la matière ou de l'épreuve.</li></ul><h3>Utiliser votre propre calendrier</h3><ol style="padding-left:18px;margin:4px 0 8px"><li>Ouvrez <strong>📋 Programme IB</strong>.</li><li>Cliquez <strong>↓ Exporter CSV</strong> pour le format de référence.</li><li>Créez votre liste dans ce format et importez-la.</li></ol><h3>💡 Astuce IA</h3><p>Exportez un CSV de référence, puis fournissez ce CSV + votre PDF de calendrier à une IA (Claude, ChatGPT…) et demandez : <em>"Crée un CSV dans ce format pour ces examens."</em></p>`}

// ── CSV Export ──
function ibExportCSV(){
  const rows=ibGetRows();
  const headers=['date','dateEN','sessFR','sessEN','mFR','mEN','lvl','paper','grpFR','grpEN','typeFR','typeEN','duree','notesFR','notesEN'];
  const csv=[headers.join(','),...rows.map(r=>headers.map(h=>{const v=String(r[h]||'');return v.includes(',')||v.includes('"')||v.includes('\n')?'"'+v.replace(/"/g,'""')+'"':v;}).join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='examens_IB_2027_custom.csv';a.click();
}

// ── CSV Import ──
function ibImportCSV(event){
  const file=event.target.files&&event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const text=e.target.result.replace(/^\uFEFF/,'');
      const lines=text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){alert('Fichier invalide / Invalid file');return;}

      // Parse CSV line respecting quoted fields
      function parseCSVLine(line){
        const result=[];let cur='';let inQ=false;
        for(let i=0;i<line.length;i++){
          const c=line[i];
          if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
          else if(c===','&&!inQ){result.push(cur.trim());cur='';}
          else cur+=c;
        }
        result.push(cur.trim());
        return result;
      }

      const rawHeaders=parseCSVLine(lines[0]);
      const headers=rawHeaders.map(h=>h.toLowerCase().replace(/"/g,'').trim());

      // Comprehensive column mapping — handles both our export format and the original CSV format
      const keyMap={
        // Date columns
        'date':'date','date_fr':'date',
        'date_en':'dateEN','dateen':'dateEN',
        // Session — single column (EN or FR) or separate
        'session':'_session','session_fr':'sessFR','sessfr':'sessFR',
        'session_en':'sessEN','sessen':'sessEN',
        // Subject
        'subject_fr':'mFR','subject (fr)':'mFR','mfr':'mFR','matière (fr)':'mFR','matiere_fr':'mFR','matière_fr':'mFR',
        'subject_en':'mEN','subject (en)':'mEN','men':'mEN','matière (en)':'mEN','matiere_en':'mEN','matière_en':'mEN',
        // Level
        'level':'lvl','niveau':'lvl','lvl':'lvl','level_sl_hl':'lvl','level_nm_ns':'lvl',
        // Paper
        'paper':'paper','épreuve':'paper','epreuve':'paper',
        // Group
        'group_fr':'grpFR','groupe_fr':'grpFR','group (fr)':'grpFR','grpfr':'grpFR',
        'group_en':'grpEN','groupe_en':'grpEN','group (en)':'grpEN','grpen':'grpEN',
        // Type
        'type_fr':'typeFR','type (fr)':'typeFR','typefr':'typeFR',
        'type_en':'typeEN','type (en)':'typeEN','typeen':'typeEN',
        // Duration
        'duration_min':'duree','durée_min':'duree','duree_min':'duree',
        'duration (min)':'duree','durée (min)':'duree',
        'duration':'duree','durée':'duree','duree':'duree',
        // Notes
        'notes_fr':'notesFR','notes (fr)':'notesFR','notesfr':'notesFR',
        'notes_en':'notesEN','notes (en)':'notesEN','notesen':'notesEN',
      };

      const colIdx={};
      headers.forEach((h,i)=>{if(keyMap[h])colIdx[keyMap[h]]=i;});

      function getCell(cells,key){
        const i=colIdx[key];
        return(i!==undefined&&i<cells.length)?cells[i].replace(/^"|"$/g,'').replace(/""/g,'"').trim():'';
      }

      // Detect if there's a single Session column (EN values Morning/Afternoon)
      const hasSingleSession=colIdx['_session']!==undefined&&colIdx['sessFR']===undefined;

      function sessionToFR(s){
        const sl=s.toLowerCase().trim();
        if(sl==='morning'||sl==='matin')return 'Matin';
        if(sl==='afternoon'||sl==='après-midi')return 'Après-midi';
        return s;
      }
      function sessionToEN(s){
        const sl=s.toLowerCase().trim();
        if(sl==='matin'||sl==='morning')return 'Morning';
        if(sl==='après-midi'||sl==='afternoon')return 'Afternoon';
        return s;
      }

      // Normalise level: convert SL/HL → NM/NS for internal storage
      function normLevel(v){
        if(!v)return'NM';
        const u=v.trim().toUpperCase();
        const map={'SL':'NM','HL':'NS','SL/HL':'NM/NS','HL/SL':'NM/NS','NM/NS':'NM/NS','NS/NM':'NM/NS','NM':'NM','NS':'NS'};
        return map[u]||u;
      }

      const parsed=lines.slice(1).map(line=>{
        const cells=parseCSVLine(line);
        if(cells.every(c=>!c))return null;

        let sessFR,sessEN;
        if(hasSingleSession){
          const raw=getCell(cells,'_session');
          sessFR=sessionToFR(raw);sessEN=sessionToEN(raw);
        } else {
          sessFR=getCell(cells,'sessFR')||sessionToFR(getCell(cells,'sessEN'));
          sessEN=getCell(cells,'sessEN')||sessionToEN(getCell(cells,'sessFR'));
        }

        return{
          date:getCell(cells,'date'),
          dateEN:getCell(cells,'dateEN'),
          sessFR,sessEN,
          mFR:getCell(cells,'mFR'),
          mEN:getCell(cells,'mEN'),
          lvl:normLevel(getCell(cells,'lvl')),
          paper:getCell(cells,'paper'),
          grpFR:getCell(cells,'grpFR'),
          grpEN:getCell(cells,'grpEN'),
          typeFR:getCell(cells,'typeFR')||'Non structuré',
          typeEN:getCell(cells,'typeEN')||'Unstructured',
          duree:getCell(cells,'duree'),
          notesFR:getCell(cells,'notesFR'),
          notesEN:getCell(cells,'notesEN'),
        };
      }).filter(r=>r&&(r.mFR||r.mEN));

      if(!parsed.length){
        alert(uiLang==='fr'?'Aucune ligne valide trouvée.':'No valid rows found.');
        event.target.value='';return;
      }

      // Merge: update existing rows matched by date+mFR+lvl+paper, add new ones
      const existing=ibGetRows();
      let added=0,updated=0;
      parsed.forEach(nr=>{
        const idx=existing.findIndex(er=>
          er.date===nr.date&&er.mFR===nr.mFR&&er.lvl===nr.lvl&&er.paper===nr.paper);
        if(idx>=0){Object.assign(existing[idx],nr);updated++;}
        else{existing.push(nr);added++;}
      });
      ibSaveRows();ibRenderModalTable();
      const fr=uiLang==='fr';
      alert(fr?(added+' ajoutée(s), '+updated+' mise(s) à jour'):(added+' added, '+updated+' updated'));
    }catch(err){alert('Erreur import / Import error: '+err.message+'\n'+err.stack);}
    event.target.value='';
  };
  reader.readAsText(file,'UTF-8');
}
