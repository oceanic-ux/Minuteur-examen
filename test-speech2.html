<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Test Speech 2</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f0f0f0}
button{display:block;width:100%;padding:18px;margin:8px 0;font-size:16px;border-radius:12px;border:none;background:#3a7bd5;color:#fff;cursor:pointer;-webkit-appearance:none}
#log{background:#fff;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;margin-top:10px;min-height:150px;max-height:300px;overflow-y:auto}
</style>
</head>
<body>
<h2>Test Speech 2</h2>

<button id="b1">1. Direct (dans le handler)</button>
<button id="b2">2. setTimeout 0ms</button>
<button id="b3">3. setTimeout 500ms</button>
<button id="b4">4. setInterval 1s</button>
<button id="b5">5. Audio ontimeupdate</button>
<button id="b6">6. audioMode=voice + announce()</button>
<button onclick="document.getElementById('log').textContent=''">Effacer</button>

<div id="log"></div>

<script>
const log = document.getElementById('log');
function L(msg){log.textContent=new Date().toLocaleTimeString()+': '+msg+'\n'+log.textContent;}

L('speechSynthesis: '+(!!window.speechSynthesis));

function doSpeak(text){
  if(!window.speechSynthesis){L('PAS DE speechSynthesis');return;}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='fr-FR'; u.volume=1; u.rate=0.9;
  const vv=window.speechSynthesis.getVoices();
  L('voix dispo: '+vv.length+(vv[0]?' ex:'+vv[0].name:''));
  u.onstart=()=>L('ONSTART: '+text);
  u.onend=()=>L('ONEND ok');
  u.onerror=(e)=>L('ERREUR: '+JSON.stringify(e.error));
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  L('speak() appelé — pending:'+window.speechSynthesis.pending+' speaking:'+window.speechSynthesis.speaking);
}

document.getElementById('b1').onclick=()=>{L('--- Test 1 direct ---');doSpeak('Test un direct');};
document.getElementById('b2').onclick=()=>{L('--- Test 2 setTimeout 0 ---');setTimeout(()=>doSpeak('Test deux setTimeout zéro'),0);};
document.getElementById('b3').onclick=()=>{L('--- Test 3 setTimeout 500 ---');setTimeout(()=>doSpeak('Test trois setTimeout cinq cents'),500);};

document.getElementById('b4').onclick=()=>{
  L('--- Test 4 setInterval ---');
  let n=0;
  const iv=setInterval(()=>{
    n++;L('tick '+n);
    if(n===2){clearInterval(iv);doSpeak('Test quatre setInterval');}
  },1000);
};

document.getElementById('b5').onclick=()=>{
  L('--- Test 5 audio ontimeupdate ---');
  const wav='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  const a=new Audio(wav);a.loop=true;a.volume=0;
  let done=false;
  a.ontimeupdate=()=>{if(!done){done=true;a.pause();L('ontimeupdate fired');doSpeak('Test cinq audio ontimeupdate');}};
  a.play().then(()=>L('audio joue')).catch(e=>L('audio erreur:'+e));
};

// Simulate exactly what our app does
let _audioTick=null,_pendingQueue=[],_speechBusy=false;
document.getElementById('b6').onclick=()=>{
  L('--- Test 6 simulate app ---');
  // Start audio session
  const wav='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  _audioTick=new Audio(wav);_audioTick.loop=true;_audioTick.volume=0;
  _audioTick.ontimeupdate=()=>{
    if(!_pendingQueue.length||_speechBusy)return;
    _speechBusy=true;
    const {text}=_pendingQueue.shift();
    L('ontimeupdate → speak: '+text);
    const u=new SpeechSynthesisUtterance(text);
    u.lang='fr-FR';u.volume=1;u.rate=0.9;
    u.onstart=()=>L('ONSTART');
    u.onend=()=>{L('ONEND');_speechBusy=false;};
    u.onerror=(e)=>{L('ERREUR:'+e.error);_speechBusy=false;};
    window.speechSynthesis.speak(u);
  };
  _audioTick.play().then(()=>{
    L('audio joue, queue dans 2s...');
    // Simulate what the timer does: add to queue after 2 seconds
    setTimeout(()=>{
      L('ajout à la queue');
      _pendingQueue.push({text:'Test six simulation application'});
    },2000);
  }).catch(e=>L('audio err:'+e));
};

window.speechSynthesis&&(window.speechSynthesis.onvoiceschanged=()=>L('voiceschanged: '+window.speechSynthesis.getVoices().length+' voix'));
</script>
</body>
</html>
